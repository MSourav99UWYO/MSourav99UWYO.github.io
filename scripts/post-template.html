<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{TITLE}} — Sourav Majumder</title>
  <meta name="description" content="{{EXCERPT}}" />
  <meta name="author" content="Sourav Majumder" />
  <link rel="alternate" type="application/rss+xml" title="Notes by Sourav Majumder" href="/blog/rss.xml" />
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml" />

  <!-- Prevent FOUC: set theme synchronously -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        var prefers = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (t === 'dark' || (!t && prefers)) document.documentElement.classList.add('dark');
      } catch (e) {}
    })();
  </script>

  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300..900;1,8..60,300..900&family=IBM+Plex+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/output.css" />

  <!-- KaTeX CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
</head>
<body>
  <!-- Header -->
  <header class="border-b border-line dark:border-line-dark">
    <div class="container-page py-5 flex items-center justify-between">
      <a href="/" class="font-serif text-base font-medium tracking-tight">Sourav Majumder</a>
      <nav class="flex items-center gap-6">
        <a href="/" class="nav-link">Home</a>
        <a href="/research.html" class="nav-link">Research</a>
        <a href="/publications.html" class="nav-link">Publications</a>
        <a href="/cv.html" class="nav-link">CV</a>
        <a href="/blog/" class="nav-link" aria-current="page">Notes</a>
        <a href="/contact.html" class="nav-link">Contact</a>
        <button id="theme-toggle" class="text-muted dark:text-muted-dark hover:text-ink dark:hover:text-ink-dark transition-colors ml-2" aria-label="Toggle theme"></button>
      </nav>
    </div>
  </header>

  <main class="container-prose py-16">
    <a href="/blog/" class="font-sans text-xs uppercase tracking-wider text-muted dark:text-muted-dark hover:text-accent dark:hover:text-accent-dark transition-colors mb-8 inline-block">← All notes</a>

    <article>
      <header class="mb-10 border-b border-line dark:border-line-dark pb-8">
        <div class="font-sans text-sm text-muted dark:text-muted-dark mb-3">
          <time datetime="{{DATE_ISO}}">{{DATE}}</time>
        </div>
        <h1 class="font-serif text-4xl sm:text-5xl font-medium leading-[1.1] tracking-tightest mb-4">{{TITLE}}</h1>
        <div class="flex gap-2 flex-wrap">{{TAGS}}</div>
      </header>

      <div class="prose-content">
        {{CONTENT}}
      </div>
    </article>

    <div class="border-t border-line dark:border-line-dark mt-16 pt-8 flex justify-between text-sm font-sans text-muted dark:text-muted-dark">
      <a href="/blog/" class="hover:text-accent dark:hover:text-accent-dark transition-colors">← All notes</a>
      <a href="/blog/rss.xml" class="hover:text-accent dark:hover:text-accent-dark transition-colors">RSS feed</a>
    </div>
  </main>

  <footer class="border-t border-line dark:border-line-dark mt-20">
    <div class="container-page py-8 text-xs font-sans text-muted dark:text-muted-dark flex flex-col sm:flex-row justify-between gap-2">
      <div>© 2026 Sourav Majumder</div>
      <div>Built with HTML, Tailwind CSS, and vanilla JS.</div>
    </div>
  </footer>

  <script src="/js/theme.js"></script>
  <script src="/js/citations.js"></script>

  <!-- KaTeX: load lib + auto-render, then trigger render -->
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <script src="/js/katex-render.js"></script>
</body>
</html>
